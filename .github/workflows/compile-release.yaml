name: compile-release
on:
  push:
    tags:
    - "v*"
    - "*int-test"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Static OCI chart version for integration tests (`helm install ... --version`).
      # Operator image tag remains the release tag (VERSION).
      INT_TEST_CHART_VERSION: "0.0.0-int-test"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    - name: Set up Helm
      uses: azure/setup-helm@v4.3.1

    - name: Extract version from tag
      shell: bash
      run: |
        echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        echo "Using version: ${VERSION}"

    - name: Run build script for CLI
      shell: bash
      run: |
        set -e
        chmod +x build_cli_all_arch.sh
        ./build_cli_all_arch.sh "$VERSION"

    - name: Compress workloads
      shell: bash
      run: |
        zip -r workloads.zip ./workloads

    - name: Log in to DockerHub
      run: |
        echo "${{ secrets.DOCKER_HUB_PUSH }}" | docker login docker.io -u "${{ secrets.DOCKER_HUB_PUSH_USER }}" --password-stdin

    - name: Build and push operator image
      run: |
        IMAGE_NAME=docker.io/silogenai/kaiwo-operator
        TAG=${{ env.VERSION }}

        # Build the Docker image
        make docker-build IMG=$IMAGE_NAME:$TAG

        # Push the image
        make docker-push IMG=$IMAGE_NAME:$TAG

    - name: Generate install.yaml
      run: |
        make build-installer TAG=${{ env.VERSION }} IMG=docker.io/silogenai/kaiwo-operator:${{ env.VERSION }}
        cp dist/install.yaml install.yaml

    - name: Point Helm chart at public mirror (amdenterpriseai)
      run: |
        # The packaged chart's image defaults to the PUBLIC
        # docker.io/amdenterpriseai/kaiwo-operator mirror, which only carries
        # this version *after* the manual silogenai -> amdenterpriseai image
        # promotion has run. The operator image is actually pushed to the
        # private docker.io/silogenai org by this workflow. To install
        # *before* promotion, override back to silogenai and provide a pull
        # secret:
        #   --set image.repository=silogenai/kaiwo-operator \
        #   --set imagePullSecrets[0].name=dockerhub-regcred
        # (registry stays docker.io). Leave image.tag empty so it falls back
        # to the chart appVersion (the release VERSION).
        sed -i.bak 's|^  registry:.*|  registry: docker.io|' chart/values.yaml
        sed -i.bak 's|^  repository:.*|  repository: amdenterpriseai/kaiwo-operator|' chart/values.yaml
        rm -f chart/values.yaml.bak

    - name: Package Helm chart
      run: |
        make helm-release TAG=${{ env.VERSION }} CHART_VERSION=${{ env.VERSION }} IMG=docker.io/silogenai/kaiwo-operator:${{ env.VERSION }}

    - name: Compile CRDs to a single manifest
      run: |
        make crds

    - name: Package CRDs as Helm chart
      run: |
        make crds-package CHART_VERSION=${{ env.VERSION }} TAG=${{ env.VERSION }}

    - name: Log in to DockerHub (Helm/OCI)
      run: echo "${{ secrets.DOCKER_HUB_PUSH }}" | helm registry login registry-1.docker.io -u "${{ secrets.DOCKER_HUB_PUSH_USER }}" --password-stdin


    - name: Push Helm chart to OCI registry
      run: make helm-push-oci TAG=${{ env.VERSION }} CHART_VERSION=${{ env.VERSION }} CHART_OCI_REGISTRY=docker.io CHART_OCI_OWNER=silogenai

    - name: Push CRDs chart to OCI registry
      run: make crds-push-oci CHART_VERSION=${{ env.VERSION }} TAG=${{ env.VERSION }} CHART_OCI_REGISTRY=docker.io CHART_OCI_OWNER=silogenai

    - name: Push Helm and CRDs OCI charts for integration testing (static chart tag)
      run: |
        # Int-test images are pushed only to the private silogenai org and are
        # NOT mirrored to amdenterpriseai, so the int-test chart must point at
        # silogenai (where the image actually lives) rather than the public
        # mirror baked into the real release chart above. Registry stays
        # docker.io.
        sed -i.bak 's|^  repository:.*|  repository: silogenai/kaiwo-operator|' chart/values.yaml
        rm -f chart/values.yaml.bak
        IMG=docker.io/silogenai/kaiwo-operator:${{ env.VERSION }}
        TAG=${{ env.VERSION }}
        CHART_VER=${{ env.INT_TEST_CHART_VERSION }}
        make helm-package TAG="${TAG}" CHART_VERSION="${CHART_VER}" IMG="${IMG}"
        make helm-push-oci TAG="${TAG}" CHART_VERSION="${CHART_VER}" CHART_OCI_REGISTRY=docker.io CHART_OCI_OWNER=silogenai
        make crds-push-oci CHART_VERSION="${CHART_VER}" TAG="${TAG}" CHART_OCI_REGISTRY=docker.io CHART_OCI_OWNER=silogenai


    - name: Upload install.yaml artifact
      uses: actions/upload-artifact@v4
      with:
        name: install-yaml
        path: install.yaml

    - name: Upload Helm chart artifact
      uses: actions/upload-artifact@v4
      with:
        name: helm-chart
        path: dist/kaiwo-operator-chart-*.tgz

    - name: Upload CRDs artifact
      uses: actions/upload-artifact@v4
      with:
        name: crds-yaml
        path: crds.yaml

    - name: Create draft release and upload assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          builds/*
          workloads.zip
          install.yaml
          crds.yaml
          dist/kaiwo-operator-chart-*.tgz
        token: '${{ secrets.GITHUB_TOKEN }}'
        draft: true
        prerelease: true
        body: |
          ## Installation

          The packaged Helm chart's `image.repository` points at the public
          `docker.io/amdenterpriseai/kaiwo-operator`, which only carries this
          version *after* the manual silogenai → amdenterpriseai image
          promotion has run.

          ### Internal install (pre-promotion, silogenai)

          To install **before** promotion, override the image back to the
          private `silogenai` org and provide a `dockerhub-regcred` pull
          secret in the install namespace (skip if it is already present):

          ```bash
          kubectl create namespace kaiwo-system --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry dockerhub-regcred \
            --namespace kaiwo-system \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=<dockerhub-user> \
            --docker-password=<dockerhub-token>

          helm install kaiwo oci://docker.io/silogenai/kaiwo-operator-chart \
            --version ${{ env.VERSION }} \
            --namespace kaiwo-system --create-namespace \
            --set image.repository=silogenai/kaiwo-operator \
            --set imagePullSecrets[0].name=dockerhub-regcred
          ```

          ---

          ### Kubernetes Install (kubectl)
          ```bash
          kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/install.yaml --server-side
          ```

          ### If using Helm - Install CRDs first
          ```bash
          helm install kaiwo-crds oci://docker.io/silogenai/kaiwo-crds-chart \
            --version ${{ env.VERSION }} --namespace kaiwo-system --create-namespace
          ```

          ### Helm Install (from GitHub Releases)
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}/kaiwo-operator-chart-${{ env.VERSION }}.tgz -o kaiwo-operator-chart.tgz
          helm install kaiwo kaiwo-operator-chart.tgz --namespace kaiwo-system --create-namespace
          ```

          ### Helm Install (from OCI Registry)
          ```bash
          helm install kaiwo oci://docker.io/silogenai/kaiwo-operator-chart \
            --version ${{ env.VERSION }} --namespace kaiwo-system --create-namespace
          ```

          > NOTE: OCI charts are published to `docker.io/silogenai/*` (previously
          > `oci://ghcr.io/${{ github.repository_owner }}/*`). The chart's baked-in
          > operator image points at `docker.io/amdenterpriseai/kaiwo-operator`
          > (post-promotion). Update automation using the old paths.

          ### Docker Images
          - Operator (chart default, post-promotion): `docker.io/amdenterpriseai/kaiwo-operator:${{ env.VERSION }}`
          - Operator (pre-promotion source): `docker.io/silogenai/kaiwo-operator:${{ env.VERSION }}`

